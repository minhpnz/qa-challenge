name: E2E

# Pipeline shape mirrors the cost of the signal:
#   verify  (seconds)  — formatting, lint, types. Nothing else runs if this fails.
#   api     (~1 min)   — no browser, so it gates every PR.
#   ui      (minutes)  — sharded and matrixed across browsers; blob reports are
#                        merged into one HTML report at the end.
#   perf    (on demand) — timing assertions are meaningless on a contended runner
#                        during a busy PR window, so they are never part of the
#                        PR gate. They run via workflow_dispatch rather than on a
#                        nightly cron: this suite tests a third-party public demo
#                        site, so a scheduled run fails whenever that site is
#                        down — turning the status badge red for reasons that have
#                        nothing to do with the code. A green badge has to mean
#                        "the last change was good", or it means nothing.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      grep:
        description: 'Only run tests matching this tag (e.g. @smoke)'
        required: false
        default: ''

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_ENV: production
  NODE_VERSION: '20'

jobs:
  verify:
    name: Lint, format and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run verify

  api:
    name: API tests
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # No browser download: the API project never launches one.
      - run: npx playwright test --project=api ${{ github.event.inputs.grep && format('--grep {0}', github.event.inputs.grep) || '' }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: api-results
          path: test-results/junit.xml
          retention-days: 14

  ui:
    name: UI ${{ matrix.project }} (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [ui-chromium, ui-firefox, ui-webkit]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.project == 'ui-chromium' && 'chromium' || matrix.project == 'ui-firefox' && 'firefox' || 'webkit' }}
      - name: Run tests
        run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2 --reporter=blob
        env:
          # Retries exist to absorb infrastructure noise, not to hide flaky tests.
          # Anything that only passes on retry is triaged, not ignored — see
          # README §Flaky-test policy.
          RETRIES: 2
          WORKERS: 2
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: blob-${{ matrix.project }}-${{ matrix.shard }}
          path: blob-report
          retention-days: 7

  report:
    name: Merge report
    runs-on: ubuntu-latest
    needs: [ui]
    # `!cancelled()` alone is not enough: when an upstream job fails, `ui` is
    # SKIPPED and produces no blob artifacts, so this job ran anyway and died on
    # a missing directory — a second red job that tells you nothing about the
    # actual failure. Only merge when `ui` genuinely ran, pass or fail.
    if: ${{ !cancelled() && (needs.ui.result == 'success' || needs.ui.result == 'failure') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-*
          merge-multiple: true
      - name: Merge into one HTML report
        run: npx playwright merge-reports --reporter=html ./all-blob-reports
      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  performance:
    name: Performance budgets
    runs-on: ubuntu-latest
    needs: verify
    if: ${{ github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=performance
        env:
          # Shared CI runners are noisy neighbours; budgets are relaxed here so a
          # nightly run reports real regressions rather than runner contention.
          PERF_BUDGET_TTFB_MS: 3000
          PERF_BUDGET_DOM_CONTENT_LOADED_MS: 8000
          PERF_BUDGET_PAGE_LOAD_MS: 12000
          PERF_BUDGET_API_P95_MS: 3000
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: performance-report
          path: |
            playwright-report
            test-results
          retention-days: 30
